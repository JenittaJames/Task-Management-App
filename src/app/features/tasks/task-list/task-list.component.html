<div class="task-list">
  <div class="header">
    <h2>Tasks</h2>
    <a routerLink="/tasks/new" class="btn btn-primary">Add Task</a>
  </div>
  
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Deadline</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (task of tasks(); track task.id) {
          <tr>
            <td>{{ task.title }}</td>
            <td>{{ task.deadline | date }}</td>
            <td><app-status-badge [status]="task.status"></app-status-badge></td>
            <td class="actions">
              <a [routerLink]="['/tasks', task.id]" class="btn btn-sm btn-info">View</a>
              <a [routerLink]="['/tasks', task.id, 'edit']" class="btn btn-sm btn-warning">Edit</a>
              <button (click)="deleteTask(task.id)" class="btn btn-sm btn-danger">Delete</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="text-center">No tasks found. Create one!</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
